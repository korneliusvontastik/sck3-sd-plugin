<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Open Logs</title>
<style>
  :root {
    --bg: #00000000;
    --surface: #2a2a2a;
    --border: #3a3a3a;
    --text: #e0e0e0;
    --dim: #888;
    --accent: #4da6ff;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    padding: 12px;
  }
  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .label {
    font-size: 11px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }
  pre.log-box {
    max-height: 220px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
    font-family: "Consolas", monospace;
    font-size: 11px;
    color: var(--text);
    background: #111;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 8px;
    margin-top: 4px;
  }
  .file-hint { color: var(--dim); font-size: 10px; word-break: break-all; margin-top: 3px; }
  .file-hint.clickable { cursor: pointer; }
  .file-hint.clickable:hover { color: var(--accent); text-decoration: underline; }
  .btn-row { display: flex; gap: 6px; margin-top: 8px; }
  button {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    cursor: pointer;
    font-family: var(--font);
    font-size: 12px;
    padding: 4px 10px;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  #status { color: var(--dim); font-size: 11px; text-align: center; padding-top: 4px; }
</style>
</head>
<body>

<!-- Plugin logs -->
<div class="section">
  <div class="label">Recent Plugin Log</div>
  <pre class="log-box" id="logBox"></pre>
  <div class="file-hint" id="logFileHint"></div>
  <div class="btn-row">
    <button id="btnOpenLogs">View full logs</button>
  </div>
</div>

<div id="status">Connecting…</div>

<script src="pi-common.js"></script>
<script>
(function () {
  "use strict";

  function send(payload) {
    PICommon.send(payload);
  }

  function applyLogs(s) {
    document.getElementById("logBox").textContent = (s?.logTail ?? []).join("\n");
    const hintEl = document.getElementById("logFileHint");
    hintEl.textContent = s?.logPath ? `Log file: ${s.logPath}` : "";
    hintEl.className = "file-hint" + (s?.logPath ? " clickable" : "");
  }

  // Logs
  document.getElementById("btnOpenLogs").addEventListener("click", () => {
    send({ event: "openLogs" });
  });
  document.getElementById("logFileHint").addEventListener("click", () => {
    send({ event: "openLogs" });
  });

  PICommon.init("com.kvt.sck3.openlogs", {
    onStatusChange: (status) => { document.getElementById("status").textContent = status; },
    onMessage: (ev) => {
      if (ev.event === "sendToPropertyInspector" && ev.payload?.type === "logs") {
        applyLogs(ev.payload.payload);
      }
    },
  });
})();
</script>
</body>
</html>
